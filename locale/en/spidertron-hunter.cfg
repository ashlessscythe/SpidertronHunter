[mod-setting-description]
sh-search-radius=How far from the spidertron (or home) to search for enemies.
sh-max-pursuit-distance=Maximum distance from home a spidertron may travel while hunting.
sh-scan-interval=How often autonomous brains run (in ticks). Higher is cheaper.
sh-scan-budget=Maximum expensive scan operations per spidertron think.
sh-return-home-after-combat=After an area is clear of enemies, eventually return to the home position before resuming patrol.
sh-post-combat-linger-ticks=How long to keep hunting near the last fight before returning home (60 ticks = 1 second). 0 = return immediately when clear. Default 900 = 15 seconds.
sh-retreat-health-percent=Abort the hunt and return home when hull (and optionally shields) drop below this percent. 0 disables tactical retreat. Default 25.
sh-retreat-include-shields=When enabled, retreat uses combined hull + energy shield integrity. When disabled, only hull health is considered.
sh-reengage-after-retreat=After a tactical retreat and restock/repair, return to the coordinates where the retreat started and resume hunting. Off by default.
sh-restock-enabled=After returning home, wait for logistics to fulfill requests (with a timeout).
sh-repair-enabled=After returning home, wait for construction robots to repair (with a timeout).
sh-max-restock-ticks=Never wait longer than this for restock/repair; resume patrol anyway.
sh-enemy-prioritization=How to choose among candidates when scanning.
sh-max-idle-time=If stuck in WAITING longer than this, resume patrol.
sh-spiders-per-think=Cap how many spidertrons update each think tick (UPS safety).
sh-enemy-cache-ttl=How long discovered enemies stay in the shared cache.
sh-debug-mode=Show flying text for state transitions and scan results.
sh-combat-range=Preferred distance from enemies while attacking. Hunters kite instead of walking into melee.
sh-combat-style=hold = keep range on the radial line. strafe = side-step with pauses. circle = orbit the target. flank = prefer an angled approach.
sh-avoid-acid=Steer combat waypoints away from acid splash fires and leave puddles urgently.
sh-combat-move-interval=Minimum ticks between voluntary combat reposition moves (strafe/circle/flank).
sh-combat-pause-ticks=After each combat hop, pause this long to stand still and shoot before the next hop.

