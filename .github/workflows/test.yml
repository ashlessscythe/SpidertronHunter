name: Tests

on:
  push:
    branches: [dev, public]
  pull_request:

jobs:
  pure-lua:
    name: Pure Lua tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4
          sudo ln -sf "$(command -v lua5.4)" /usr/local/bin/lua
      - name: Run tests
        run: lua tests/run.lua
      - name: Smoke-test packaging
        run: |
          chmod +x scripts/package_mod.sh
          sudo apt-get install -y zip
          ./scripts/package_mod.sh dist
          ZIP=$(python3 -c "import json; i=json.load(open('info.json')); print(f\"{i['name']}_{i['version']}.zip\")")
          unzip -l "dist/${ZIP}" | head -20
          # Portal requires top-level folder ModName_Version/
          PREFIX=$(python3 -c "import json; i=json.load(open('info.json')); print(f\"{i['name']}_{i['version']}/\")")
          unzip -l "dist/${ZIP}" | grep -F "${PREFIX}info.json"
          unzip -l "dist/${ZIP}" | grep -F "${PREFIX}changelog.txt"
          # Mod Portal rejects executables / shell scripts in the package
          BAD_NAMES="$(unzip -Z1 "dist/${ZIP}" | grep -Ei '\.(sh|ps1|py|exe|dll|so|dylib|bat|cmd|com)$' || true)"
          if [[ -n "${BAD_NAMES}" ]]; then
            echo "Portal zip must not contain executables or shell scripts:"
            printf '%s\n' "${BAD_NAMES}"
            exit 1
          fi
          BAD_MODE="$(unzip -Z "dist/${ZIP}" | awk 'NR>2 && $1 !~ /^d/ && $1 ~ /x/ { print }')"
          if [[ -n "${BAD_MODE}" ]]; then
            echo "Portal zip must not contain files with the execute bit set:"
            printf '%s\n' "${BAD_MODE}"
            exit 1
          fi

  in-game:
    name: In-game tests (factorio-test, headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Mod targets Factorio 2.1; factorio-test needs 2.1.24+, so follow the experimental channel.
      - name: Resolve Factorio version
        id: factorio
        run: echo "version=$(curl -fsSL https://factorio.com/api/latest-releases | jq -r .experimental.headless)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: factorio-cache
        with:
          path: ~/factorio
          key: factorio-headless-${{ steps.factorio.outputs.version }}
      - name: Download Factorio headless
        if: steps.factorio-cache.outputs.cache-hit != 'true'
        run: curl -fsSL "https://factorio.com/get-download/${{ steps.factorio.outputs.version }}/headless/linux64" | tar -xJ -C ~
      - run: echo ~/factorio/bin/x64 >> "$GITHUB_PATH"

      - run: npm install --no-save factorio-test-cli

      - uses: actions/cache@v4
        with:
          path: factorio-test-data-dir/mods/*.zip
          key: factorio-mods-${{ hashFiles('info.json', 'factorio-test.lock.json') }}
      - name: Install mods
        run: npx factorio-test mods install --mod-path .
        env:
          FACTORIO_USERNAME: ${{ secrets.FACTORIO_USERNAME }}
          FACTORIO_TOKEN: ${{ secrets.FACTORIO_TOKEN }}

      - name: Smoke tests
        run: npx factorio-test run --mod-path . --tag-blacklist visual
      - name: Hunter scenarios (visual-tagged, headless)
        run: npx factorio-test run --mod-path . --tag-whitelist visual
